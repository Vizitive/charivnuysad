<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="192x192" href="Logo6.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Безпека під час війни</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3fff3;
      color: #333;
    }

    /* ===== Верхня панель ===== */
    .top-bar {
      display: flex;
	  border-radius: 10px;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(90deg, #fff, #fff);
      padding: 12px 20px;
      flex-wrap: wrap;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .top-bar .left,
    .top-bar .right {
      flex: 1 1 100%;
      margin-bottom: 6px;
    }

    .top-bar a {
      color: #4026a7;
      text-decoration: none;
      font-weight: bold;
    }

    .social img {
      width: 24px;
      height: 24px;
      vertical-align: middle;
    }

    /* ===== Заголовок ===== */
    header {
      background: linear-gradient(90deg, #43e97b, #38f9d7);
	  border-radius: 15px;
      color: white;
      text-align: center;
      padding: 25px 10px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.25);
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    header h1 {
      font-size: 32px;
      margin: 0;
      letter-spacing: 1px;
    }

    /* ===== Основна частина ===== */
    main {
      padding: 25px 15px;
      text-align: center;
    }

    .pdf-container {
      width: 100%;
      max-width: 900px;
      margin: 25px auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.2);
      overflow: hidden;
      border: 4px solid transparent;
      background-image: linear-gradient(white, white),
        linear-gradient(90deg, #64f38c, #43e97b, #38ef7d);
      background-origin: border-box;
      background-clip: content-box, border-box;
    }

    iframe {
      width: 100%;
      height: 80vh;
      border: none;
    }

    /* ===== Кнопки ===== */
    .download-link,
    .back-button,
    .switch-button {
      display: inline-block;
      margin: 10px 8px;
      background: linear-gradient(90deg, #43e97b, #38f9d7);
      color: #fff;
      padding: 12px 25px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(56, 249, 215, 0.4);
    }

    .download-link:hover,
    .back-button:hover,
    .switch-button:hover {
      background: linear-gradient(90deg, #32b92b, #1ee8a7);
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 6px 16px rgba(50, 185, 43, 0.5);
    }

    footer {
      background: linear-gradient(90deg, #a8ff78, #78ffd6);
      text-align: center;
      padding: 12px;
      font-size: 14px;
      color: #333;
      margin-top: 40px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
    }

    @media (max-width: 768px) {
      header h1 { font-size: 24px; }
      iframe { height: 70vh; }
      .download-link, .back-button, .switch-button {
        width: 90%;
        margin: 8px auto;
        display: block;
      }
    }
  </style>
</head>
<body>
  <!-- Заголовок -->
  <header>
    <h1>Поради під час війни</h1>
  </header>

  <!-- Основна частина -->
  <main>
    <p>Оберіть документ, який хочете переглянути:</p>

    <div>
      <!-- Текст кнопок та назви документів змінені відповідно до твого запиту -->
      <button class="switch-button" onclick="showPDF('bezpeka.pdf', '📘 Безпека учасників освітнього процесу')">
        Безпека учасників освітнього процесу
      </button>

      <button class="switch-button" onclick="showPDF('fiz_bezpeka.pdf', '📗 Фізична безпека дітей під час війни')">
        Фізична безпека дітей під час війни
      </button>
    </div>

    <h2 id="pdf-title">📘 Безпека учасників освітнього процесу</h2>

    <div class="pdf-container">
      <iframe id="pdf-frame" src="bezpeka.pdf"></iframe>
    </div>

    <div>
      <!-- Замість history.back() тепер посилання на головну -->
      <a id="download-link" href="bezpeka.pdf" class="download-link" download>📥 Завантажити PDF</a>
      <a href="index.html" class="back-button">⬅ На головну</a>
    </div>
  </main>

  <footer>
    © 2025 Тийгласький ЗДО "Чарівний сад"
  </footer>

  <script>
    /**
     * Показує в iframe вказаний файл і оновлює заголовок + посилання на завантаження.
     * Якщо у тебе інші імена файлів — поміняй 'bezpeka.pdf' і 'porady.pdf' на потрібні.
     */
    function showPDF(file, title) {
      const frame = document.getElementById('pdf-frame');
      const titleEl = document.getElementById('pdf-title');
      const download = document.getElementById('download-link');

      frame.src = file;
      titleEl.innerText = title;
      download.href = file;
    }
  </script>

</body>
</html>
