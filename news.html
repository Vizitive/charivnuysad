<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Новини</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="192x192" href="Logo6.png">

<style>
    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #f9fdfa;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    header {
        background: linear-gradient(90deg, #43e97b, #38f9d7);
        padding: 25px;
        text-align: center;
        font-size: 32px;
        color: white;
        font-weight: bold;
        position: relative;
    }

    .back-text {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
        font-weight: normal;
        color: white;
        cursor: pointer;
        text-decoration: underline;
        user-select: none;
    }

    .back-text:hover { color: #f1fff4; }

    .container {
        flex: 1;
        max-width: 1000px;
        margin: auto;
        padding: 20px;
    }

    h2 {
        text-align: center;
        font-size: 28px;
        margin: 30px 0;
        color: #0e744e;
        font-weight: bold;
        padding-bottom: 15px;
        border-bottom: 2px solid #e8f8ef;
    }

    .events-container { transition: 0.3s ease; opacity: 1; }
    .fade-out { opacity: 0; }
    .fade-in { opacity: 1; }

    .event-item {
        border-radius: 8px;
        margin: 30px 0;
        overflow: hidden;
        background: white;
        box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        border: 1px solid #e0f5e9;
        position: relative;
    }

    .event-item::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 4px;
        background: linear-gradient(90deg, #43e97b, #38f9d7);
    }

    .event-content {
        padding: 25px;
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: 25px;
    }

    .event-photo {
        width: 300px;
        height: 200px;
        object-fit: cover;
        border-radius: 6px;
        flex-shrink: 0;
        border: 1px solid #e0f5e9;
        background: #f0faf5;
        display: block;
    }

    .event-info { flex: 1; }

    .event-date {
        color: #43e97b;
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .event-title {
        color: #0e744e;
        font-size: 24px;
        margin-bottom: 15px;
        font-weight: bold;
    }

    .event-text {
        font-size: 17px;
        color: #333;
        line-height: 1.5;
        margin-bottom: 20px;
    }

    .details-btn {
        display: inline-block;
        padding: 10px 25px;
        background: linear-gradient(90deg, #43e97b, #38f9d7);
        color: white;
        font-size: 16px;
        font-weight: bold;
        border-radius: 6px;
        text-decoration: none;
        transition: all 0.3s;
        border: none;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(67, 233, 123, 0.2);
    }

    .details-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(67, 233, 123, 0.3);
        background: linear-gradient(90deg, #38d76b, #2ce7c5);
    }

    .pagination {
        text-align: center;
        margin: 40px 0 20px;
        padding-top: 20px;
        border-top: 1px solid #e8f8ef;
    }

    .page-btn {
        padding: 10px 22px;
        margin: 5px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        background: #f0faf5;
        color: #0e744e;
        border: 1px solid #c9f0db;
        transition: all 0.2s;
        user-select: none;
        display: inline-block;
    }

    .page-btn:hover {
        background: linear-gradient(90deg, #e8fcf0, #e0faf8);
        border-color: #43e97b;
    }

    .active-page {
        background: linear-gradient(90deg, #43e97b, #38f9d7);
        color: white;
        border-color: #43e97b;
        pointer-events: none;
        box-shadow: 0 2px 5px rgba(67, 233, 123, 0.2);
    }

    footer {
        background: linear-gradient(90deg, #43e97b, #38f9d7);
        padding: 20px;
        text-align: center;
        font-size: 16px;
        color: white;
        font-weight: normal;
        margin-top: 40px;
    }

    @media (max-width: 768px) {
        .event-content { flex-direction: column; }
        .event-photo { width: 100%; height: 250px; }
        header { font-size: 26px; padding: 20px; }
        .back-text { font-size: 16px; left: 15px; }
        h2 { font-size: 24px; }
        .event-title { font-size: 22px; }
    }
</style>
</head>

<body>
<header>
    Новини
    <a href="index.html" class="back-text">Назад</a>
</header>

<div class="container">
    <h2>Останні події садочка</h2>

    <div id="events" class="events-container"></div>

    <div class="pagination">
        <span class="page-btn active-page" data-page="1">1</span>
        <span class="page-btn" data-page="2">2</span>
        <span class="page-btn" data-page="3">3</span>
        <span class="page-btn" data-page="4">4</span>
		<span class="page-btn" data-page="5">5</span>
		<span class="page-btn" data-page="6">6</span>
    </div>
</div>

<footer>© 2025 Тийгласький ЗДО "Чарівний сад"</footer>

<script>
const eventsData = [
  { id: 17, photo: "news/n224a.jpg", title: "Всесвітній день сну", date: "19.03.2026", text: "Піжамна вечірка у садочку." },
  { id: 16, photo: "news/n219a.jpg", title: "Міжнародний день харчування! «Учимося варити борщ»", date: "12.03.2026", text: "Діти в ігровій формі знайомилися з процесом приготування борщу." },
  { id: 15, photo: "news/n205a.jpg", title: "Проект «Город на підвіконні»", date: "10.03.2026", text: "Вихованці висаджували рослини та спостерігали за їх ростом." },
  { id: 14, photo: "news/n193a.jpg", title: "День Державного Гімну України", date: "10.03.2026", text: "Діти слухали та вивчали Гімн України як символ держави." },
  { id: 13, photo: "news/n179a.jpg", title: "Гуманне ставлення до тварин", date: "08.03.2026", text: "Проведено виховну годину про турботу та любов до тварин." },
  { id: 12, photo: "news/n135.jpg", title: "Міжнародний день рідної мови", date: "21.02.2026", text: "Діти вивчали рідну мову через ігри та вірші." },
  { id: 11, photo: "news/n134.jpg", title: "День Державного герба України", date: "20.02.2026", text: "Ознайомлення з державними символами України." },
  { id: 10, photo: "news/n130.jpg", title: "День єднання", date: "16.02.2026", text: "Свято дружби, єдності та підтримки." },
  { id: 9, photo: "news/n129.jpg", title: "День карнавалу", date: "12.02.2026", text: "Веселе свято з костюмами та конкурсами." },
  { id: 0, photo: "news/n89.jpg", title: "День Соборності України", date: "22.01.2026", text: "Свято єдності українського народу." },
  { id: 1, photo: "news/n1.jpg", title: "Різдвяний концерт", date: "24.12.2025", text: "Святковий виступ з піснями та колядками." },
  { id: 2, photo: "news/n2.jpg", title: "День Святого Миколая", date: "05.12.2025", text: "Діти отримали подарунки та гарний настрій." },
  { id: 3, photo: "news/n4.jpg", title: "Протидія булінгу", date: "26.11.2025", text: "Бесіда про добро, повагу та дружбу." },
  { id: 4, photo: "news/n5.jpg", title: "День захисту дітей", date: "20.11.2025", text: "Свято радості та дитинства." },
  { id: 5, photo: "photos_v/v20.jpg", title: "Тиждень безпеки дорожнього руху", date: "13.11.2025", text: "Діти вчили правила дорожнього руху." },
  { id: 6, photo: "news/n3.jpg", title: "День української мови", date: "27.10.2025", text: "Розвиток любові до рідної мови." },
  { id: 7, photo: "photos_v/v5.jpg", title: "Свято «Золота осінь»", date: "23.10.2025", text: "Осіннє свято з піснями та танцями." }
];

// конвертація дати
function parseDate(str) {
  const [day, month, year] = str.split(".").map(Number);
  return new Date(year, month - 1, day);
}

// сортування (нові зверху)
eventsData.sort((a, b) => parseDate(b.date) - parseDate(a.date));

// розбивка на сторінки
const perPage = 3;
const pages = [];

for (let i = 0; i < eventsData.length; i += perPage) {
  pages.push(eventsData.slice(i, i + perPage));
}

// генерація кнопок
const pagination = document.querySelector(".pagination");
pagination.innerHTML = "";

pages.forEach((_, i) => {
  const btn = document.createElement("span");
  btn.className = "page-btn";
  btn.dataset.page = i + 1;
  btn.textContent = i + 1;

  btn.addEventListener("click", () => loadPage(i + 1));
  pagination.appendChild(btn);
});

function renderEvents(page){
  const box = document.getElementById("events");
  const data = pages[page - 1];
  if (!data) return;

  box.innerHTML = data.map(event => `
    <div class="event-item">
      <div class="event-content">
        <img class="event-photo" src="${event.photo}" alt="${event.title}">
        <div class="event-info">
          <div class="event-date">${event.date}</div>
          <div class="event-title">${event.title}</div>
          <div class="event-text">${event.text}</div>
          <a class="details-btn" href="event${event.id}.html">Детальніше</a>
        </div>
      </div>
    </div>
  `).join("");
}

function setActivePage(page){
  document.querySelectorAll(".page-btn").forEach(btn => {
    btn.classList.toggle("active-page", Number(btn.dataset.page) === page);
  });
}

function loadPage(page){
  const box = document.getElementById("events");

  box.classList.add("fade-out");

  setTimeout(() => {
    renderEvents(page);
    setActivePage(page);

    box.classList.remove("fade-out");
    box.classList.add("fade-in");
    setTimeout(() => box.classList.remove("fade-in"), 400);
  }, 200);
}

// старт
loadPage(1);
</script>

</body>
</html>
