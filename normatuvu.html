}

.page-header{
  background: linear-gradient(90deg, #45e79a, #2fd57c, #5be3a7);

  margin: 0 auto;
  display:grid;
  grid-template-columns: repeat(3, minmax(260px, 1fr));

.doc-card{
  text-decoration:none;

}

.doc-card:hover{

  box-shadow:0 14px 30px rgba(0,0,0,0.30);
}


.pdf-icon{
  width:52px;
  height:52px;
  border-radius:14px;
  background: rgba(0,0,0,0.18);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:14px;
  letter-spacing:0.5px;
}

.doc-title{
  font-weight:800;
  font-size:16px;
  line-height:1.25;
}


.page-footer{
  background: linear-gradient(90deg, #45e79a, #2fd57c, #5be3a7);
  color:white;
  text-align:center;
  padding:18px;
  font-weight:bold;
  box-shadow: 0 -3px 10px rgba(0,0,0,0.15);
}

/* ===== Адаптив ===== */
@media (max-width: 1000px){
  .docs-grid{
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 640px){
  .docs-grid{
    grid-template-columns: 1fr;
  }
  .page-header h1{
    font-size:26px;
  }
}
</style>
