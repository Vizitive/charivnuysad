<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Новини</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #f9fdfa;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    header {
        background: linear-gradient(90deg, #43e97b, #38f9d7);
        padding: 25px;
        text-align: center;
        font-size: 32px;
        color: white;
        font-weight: bold;
        position: relative;
    }

    .back-text {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
        font-weight: normal;
        color: white;
        cursor: pointer;
        text-decoration: underline;
    }

    .back-text:hover {
        color: #f1fff4;
    }

    .container {
        flex: 1;
        max-width: 1000px;
        margin: auto;
        padding: 20px;
    }

    h2 {
        text-align: center;
        font-size: 28px;
        margin: 30px 0;
        color: #0e744e;
        font-weight: bold;
        padding-bottom: 15px;
        border-bottom: 2px solid #e8f8ef;
    }

    .events-container {
        transition: 0.3s ease;
        opacity: 1;
    }

    .fade-out {
        opacity: 0;
    }

    .fade-in {
        opacity: 1;
    }

    /* Офіційна рамка з градієнтною межею */
    .event-item {
        border-radius: 8px;
        margin: 30px 0;
        overflow: hidden;
        background: white;
        box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        border: 1px solid #e0f5e9;
        position: relative;
    }

    .event-item::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #43e97b, #38f9d7);
    }

    .event-content {
        padding: 25px;
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: 25px;
    }

    .event-photo {
        width: 300px;
        height: 200px;
        object-fit: cover;
        border-radius: 6px;
        flex-shrink: 0;
        border: 1px solid #e0f5e9;
    }

    .event-info {
        flex: 1;
    }

    .event-date {
        color: #43e97b;
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .event-title {
        color: #0e744e;
        font-size: 24px;
        margin-bottom: 15px;
        font-weight: bold;
    }

    .event-text {
        font-size: 17px;
        color: #333;
        line-height: 1.5;
        margin-bottom: 20px;
    }

    /* Кнопка "Детальніше" з градієнтом */
    .details-btn {
        display: inline-block;
        padding: 10px 25px;
        background: linear-gradient(90deg, #43e97b, #38f9d7);
        color: white;
        font-size: 16px;
        font-weight: bold;
        border-radius: 6px;
        text-decoration: none;
        transition: all 0.3s;
        border: none;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(67, 233, 123, 0.2);
    }

    .details-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(67, 233, 123, 0.3);
        background: linear-gradient(90deg, #38d76b, #2ce7c5);
    }

    /* Пагінація */
    .pagination {
        text-align: center;
        margin: 40px 0 20px;
        padding-top: 20px;
        border-top: 1px solid #e8f8ef;
    }

    .page-btn {
        padding: 10px 22px;
        margin: 5px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        background: #f0faf5;
        color: #0e744e;
        border: 1px solid #c9f0db;
        transition: all 0.2s;
    }

    .page-btn:hover {
        background: linear-gradient(90deg, #e8fcf0, #e0faf8);
        border-color: #43e97b;
    }

    .active-page {
        background: linear-gradient(90deg, #43e97b, #38f9d7);
        color: white;
        border-color: #43e97b;
        pointer-events: none;
        box-shadow: 0 2px 5px rgba(67, 233, 123, 0.2);
    }

    footer {
        background: linear-gradient(90deg, #43e97b, #38f9d7);
        padding: 20px;
        text-align: center;
        font-size: 16px;
        color: white;
        font-weight: normal;
        margin-top: 40px;
    }

    /* Адаптивність для мобільних */
    @media (max-width: 768px) {
        .event-content {
            flex-direction: column;
        }
        
        .event-photo {
            width: 100%;
            height: 250px;
        }
        
        header {
            font-size: 26px;
            padding: 20px;
        }
        
        .back-text {
            font-size: 16px;
            left: 15px;
        }
        
        h2 {
            font-size: 24px;
        }
        
        .event-title {
            font-size: 22px;
        }
    }
</style>
</head>

<body>

<header>
    Новини
    <div class="back-text" onclick="history.back()">Назад</div>
</header>

<div class="container">
    <h2>Останні події садочка</h2>

    <div id="events" class="events-container"></div>

    <div class="pagination">
        <span class="page-btn active-page" onclick="loadPage(1)">1</span>
        <span class="page-btn" onclick="loadPage(2)">2</span>
    </div>
</div>

<footer>© 2025 Тийгласький ЗДО "Чарівний сад"</footer>

<script>
    const pages = {
        1: [
            { id: 1, photo: "photos_v/v19.jpg", title: "Свято осені", date: "10.10.2025", text: "Барвисте та тепле свято з виступами дітей та творчими номерами." },
            { id: 2, photo: "photos_v/v20.jpg", title: "Ярмарок добрих справ", date: "15.10.2025", text: "Діти виготовляли поробки та проводили доброчинний ярмарок." },
            { id: 3, photo: "photos_v/v21.jpg", title: "Тиждень безпеки", date: "20.10.2025", text: "Практичні заняття, ігри та знайомство з правилами безпеки." }
        ],
        2: [
            { id: 4, photo: "photos_v/v22.jpg", title: "День здоров'я", date: "25.10.2025", text: "Естафети, рухливі ігри та спортивні розваги." },
            { id: 5, photo: "photos_v/v23.jpg", title: "Казковий ранок", date: "30.10.2025", text: "Костюми, театралізація та чарівна атмосфера." },
            { id: 6, photo: "photos_v/v24.jpg", title: "Музичний фестиваль", date: "05.11.2025", text: "Пісні, танці та знайомство з музичними інструментами." }
        ]
    };

    function loadPage(page) {
        const box = document.getElementById("events");
        box.classList.add("fade-out");

        setTimeout(() => {
            box.innerHTML = pages[page].map(event => `
                <div class="event-item">
                    <div class="event-content">
                        <img class="event-photo" src="${event.photo}" alt="${event.title}">
                        <div class="event-info">
                            <div class="event-date">${event.date}</div>
                            <div class="event-title">${event.title}</div>
                            <div class="event-text">${event.text}</div>
                            <a class="details-btn" href="event${event.id}.html">Детальніше</a>
                        </div>
                    </div>
                </div>
            `).join("");

            document.querySelectorAll(".page-btn")
                .forEach(btn => btn.classList.remove("active-page"));
            document.querySelectorAll(".page-btn")[page - 1]
                .classList.add("active-page");

            box.classList.remove("fade-out");
            box.classList.add("fade-in");

            setTimeout(() => box.classList.remove("fade-in"), 400);
        }, 300);
    }

    loadPage(1);
</script>

</body>
</html>
