<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="192x192" href="Logo6.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Група "Білочка"</title>

  <style>
    body {
      margin: 0;
      font-family: "Comic Sans MS", "Arial", sans-serif;
      background-color: #fff9f2;
      text-align: center;
      color: #333;
    }

    .top-bar {
      background: linear-gradient(90deg, #ff8a00, #ffa84d, #ffcc80, #ff8a00);
      padding: 10px 20px;
      text-align: left;
    }

    .top-bar a {
      text-decoration: none;
      color: #8a3c00;
      font-weight: bold;
    }

    header {
      background: linear-gradient(90deg, #ff8a00, #ffa84d, #ffcc80, #ff8a00);
      color: #fff;
      padding: 30px 10px;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.25);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    main {
      padding: 40px 20px;
    }

    /* Фото-блок */
    .photo-block {
      position: relative;
      display: inline-block;
      max-width: 900px;
      width: 100%;
      border-radius: 22px;
      padding: 8px;
      background: linear-gradient(90deg, #ff8a00, #ffa84d, #ffcc80, #ff8a00);
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    .photo-block img {
      width: 100%;
      max-width: 800px;
      max-height: 600px;
      height: auto;
      border-radius: 18px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      opacity: 1;
      transition: opacity 0.75s ease-in-out; 
    }

    /* Кнопки */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: white;
      border: 3px solid #ffcf9a;
      color: #ff8a00;
      font-size: 28px;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      transition: 0.25s;
      z-index: 2;
    }

    .nav-btn:hover {
      background: #ffe5c8;
      transform: translateY(-50%) scale(1.12);
    }

    .nav-btn.left { left: 20px; }
    .nav-btn.right { right: 20px; }

    .caption {
      background: #ffffffdd;
      padding: 18px;
      font-size: 17px;
      font-style: italic;
      border-radius: 0 0 14px 14px;
    }

    footer {
      margin-top: 75px;
      padding: 20px;
      background: linear-gradient(90deg, #ff8a00, #ffa84d, #ffcc80, #ff8a00);
      color: #333;
      box-shadow: 0 -3px 10px rgba(0,0,0,0.1);
    }

    @media (max-width: 768px) {
      header h1 { font-size: 28px; }
      .nav-btn { width: 45px; height: 45px; font-size: 22px; }
    }
  </style>
</head>

<body>
  <div class="top-bar">
    <a href="index.html">⬅ На головну</a>
  </div>

  <header>
    <h1>Група "Білочка"</h1>
  </header>

  <main>
    <div class="photo-block">
      <button class="nav-btn left" onclick="prevPhoto()">❮</button>
      <img id="photo" src="photos_b/b0.jpg" alt="Фото групи Білочка">
      <button class="nav-btn right" onclick="nextPhoto()">❯</button>
      <div class="caption" id="caption">Наша весела і дружна група «Білочка» 🐿️️</div>
    </div>
  </main>

  <footer>
    © 2025 Тийгласький ЗДО "Чарівний сад"
  </footer>

  <script>
    const photos = [
      { src: "photos_b/b0.jpg", caption: "Наша весела і дружна група «Білочка» 🐿️" },
      { src: "photos_b/b1.jpg", caption: "" },
      { src: "photos_b/b2.jpg", caption: "" },
      { src: "photos_b/b3.jpg", caption: "" },
      { src: "photos_b/b4.jpg", caption: "" },
      { src: "photos_b/b5.jpg", caption: "" },
      { src: "photos_b/b6.jpg", caption: "" },
      { src: "photos_b/b7.jpg", caption: "" },
      { src: "photos_b/b8.jpg", caption: "" },
      { src: "photos_b/b9.jpg", caption: "" },
      { src: "photos_b/b10.jpg", caption: "" },
      { src: "photos_b/b11.jpg", caption: "" },
      { src: "photos_b/b12.jpg", caption: "" },
      { src: "photos_b/b13.jpg", caption: "" },
      { src: "photos_b/b14.jpg", caption: "" },
      { src: "photos_b/b15.jpg", caption: "" },
      { src: "photos_b/b16.jpg", caption: "" }
    ];

    let current = 0;

    function showPhoto(index) {
      const img = document.getElementById("photo");
      const cap = document.getElementById("caption");

      img.style.opacity = 0; // Почати зміну прозорості (фейд-аут)

      setTimeout(() => {
        img.src = photos[index].src; // Змінити джерело фото
        cap.textContent = photos[index].caption || ""; // Оновити підпис
        img.style.opacity = 1; // Плавно відобразити нове фото (фейд-ін)
      }, 200); // Затримка перед зміною зображення
    }

    function nextPhoto() {
      current = (current + 1) % photos.length;
      showPhoto(current);
    }

    function prevPhoto() {
      current = (current - 1 + photos.length) % photos.length;
      showPhoto(current);
    }
  </script>

</body>
</html>
